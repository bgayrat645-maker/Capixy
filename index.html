<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capixy Wallet</title>
    <meta name="theme-color" content="#090d16">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #090d16; color: #f8fafc; padding: 20px 16px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .brand h1 { font-size: 20px; font-weight: 700; color: #fff; }
        .brand p { font-size: 11px; color: #64748b; }
        .reset-btn { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: #ef4444; width: 36px; height: 36px; border-radius: 10px; font-size: 16px; cursor: pointer; }

        .balance-card { background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); border: 1px solid rgba(99, 102, 241, 0.25); padding: 20px; border-radius: 20px; }
        .bal-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .bal-value { font-size: 28px; font-weight: 700; color: #fff; margin: 4px 0 12px 0; }
        .stats { display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; }
        .stat-box { flex: 1; }
        .stat-lbl { font-size: 10px; color: #64748b; }
        .stat-val { font-size: 12px; font-weight: 600; }
        .stat-val.inc { color: #34d399; }
        .stat-val.exp { color: #f87171; }

        .nav-tabs { display: flex; background: #0f172a; padding: 4px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px 4px; border: none; background: transparent; color: #64748b; font-size: 11px; font-weight: 600; border-radius: 10px; cursor: pointer; text-align: center; white-space: nowrap; }
        .tab-btn.active { background: #1e293b; color: #fff; }

        .glass-box { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .box-title { font-size: 13px; font-weight: 600; color: #cbd5e1; }

        .type-switch { display: flex; background: #0f172a; padding: 3px; border-radius: 10px; gap: 4px; }
        .sw-btn { flex: 1; border: none; background: transparent; padding: 6px; font-size: 11px; font-weight: 600; color: #64748b; border-radius: 8px; cursor: pointer; }
        .sw-btn.active.exp { background: rgba(248, 113, 113, 0.2); color: #f87171; }
        .sw-btn.active.inc { background: rgba(52, 211, 153, 0.2); color: #34d399; }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 10px; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .input-field { background: #0f172a; border: 1px solid rgba(255,255,255,0.08); padding: 10px 12px; border-radius: 10px; color: #fff; font-size: 13px; outline: none; }

        .submit-btn { background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .notif-btn { background: #10b981; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 12px; cursor: pointer; width: 100%; }

        .item-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
        .item-row { background: rgba(15, 23, 42, 0.6); padding: 10px 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .item-title { font-size: 12px; font-weight: 600; color: #f1f5f9; }
        .item-sub { font-size: 9px; color: #64748b; }
        .item-right { display: flex; align-items: center; gap: 8px; }
        .item-val { font-size: 12px; font-weight: 700; }
        .item-val.inc { color: #34d399; }
        .item-val.exp { color: #f87171; }
        .del-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 4px 8px; }

        .section-page { display: none; flex-direction: column; gap: 16px; }
        .section-page.active { display: flex; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="brand">
                <h1>Capixy</h1>
                <p>Smart Money Manager</p>
            </div>
            <button class="reset-btn" onclick="clearData()">↺</button>
        </div>

        <div class="balance-card">
            <div class="bal-title">Umumiy Balans</div>
            <div class="bal-value" id="uiBalance">0 UZS</div>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-lbl">Kirim</div>
                    <div class="stat-val inc" id="uiIncome">+0 UZS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-lbl">Chiqim</div>
                    <div class="stat-val exp" id="uiExpense">-0 UZS</div>
                </div>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" id="btnTabMain" onclick="showTab('pageMain', 'btnTabMain')">Asosiy</button>
            <button class="tab-btn" id="btnTabReminders" onclick="showTab('pageReminders', 'btnTabReminders')">Eslatmalar</button>
            <button class="tab-btn" id="btnTabDebts" onclick="showTab('pageDebts', 'btnTabDebts')">Qarzlar</button>
            <button class="tab-btn" id="btnTabAnalytics" onclick="showTab('pageAnalytics', 'btnTabAnalytics')">Tahlil</button>
            <button class="tab-btn" id="btnTabSettings" onclick="showTab('pageSettings', 'btnTabSettings')">Sozlamalar</button>
        </div>

        <!-- ASOSIY SAHIFA -->
        <div id="pageMain" class="section-page active">
            <div class="glass-box">
                <div class="type-switch">
                    <button class="sw-btn active exp" id="btnExp" onclick="setMode('exp')">Chiqim (-)</button>
                    <button class="sw-btn inc" id="btnInc" onclick="setMode('inc')">Kirim (+)</button>
                </div>
                <div class="input-group">
                    <label>Nomi</label>
                    <input type="text" id="tName" class="input-field" placeholder="Masalan: Tushlik">
                </div>
                <div class="input-group">
                    <label>Summa (UZS)</label>
                    <input type="number" id="tAmount" class="input-field" placeholder="0">
                </div>
                <button class="submit-btn" onclick="addTransaction()">Qo'shish</button>
            </div>

            <div class="glass-box">
                <div class="box-title">Tranzaksiyalar</div>
                <div class="item-list" id="transList"></div>
            </div>
        </div>

        <!-- ESLATMALAR SAHIFASI -->
        <div id="pageReminders" class="section-page">
            <div class="glass-box">
                <button class="notif-btn" onclick="reqNotif()">🔔 Bildirishnoma ruxsatini berish</button>
            </div>
            <div class="glass-box">
                <div class="box-title">Yangi Eslatma</div>
                <div class="input-group">
                    <label>Eslatma Matni</label>
                    <input type="text" id="rTitle" class="input-field" placeholder="Masalan: Kommunal to'lov">
                </div>
                <div class="input-group">
                    <label>Vaqti</label>
                    <input type="datetime-local" id="rTime" class="input-field">
                </div>
                <button class="submit-btn" onclick="addReminder()">Eslatmani Saqlash</button>
            </div>
            <div class="glass-box">
                <div class="box-title">Eslatmalar Ro'yxati</div>
                <div class="item-list" id="reminderList"></div>
            </div>
        </div>

        <!-- QARZLAR SAHIFASI -->
        <div id="pageDebts" class="section-page">
            <div class="glass-box">
                <div class="box-title">Yangi Qarz</div>
                <div class="input-group">
                    <label>Shaxs Ismi</label>
                    <input type="text" id="dName" class="input-field" placeholder="Kimga / Kimdan">
                </div>
                <div class="input-group">
                    <label>Summa</label>
                    <input type="number" id="dAmount" class="input-field" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Yo'nalish</label>
                    <select id="dType" class="input-field">
                        <option value="give">Berdim (Menga berishi kerak)</option>
                        <option value="take">Oldim (Men berishim kerak)</option>
                    </select>
                </div>
                <button class="submit-btn" onclick="addDebt()">Qarzni Saqlash</button>
            </div>
            <div class="glass-box">
                <div class="box-title">Qarzlar Ro'yxati</div>
                <div class="item-list" id="debtList"></div>
            </div>
        </div>

        <!-- TAHLIL SAHIFASI -->
        <div id="pageAnalytics" class="section-page">
            <div class="glass-box">
                <div class="box-title">Oylik Limit Sozlash</div>
                <div class="input-group">
                    <label>Limit Summasi</label>
                    <input type="number" id="budgetLimit" class="input-field" placeholder="0">
                </div>
                <button class="submit-btn" onclick="saveLimit()">Limitni Saqlash</button>
            </div>
            <div class="glass-box">
                <div class="box-title">Xulosa</div>
                <div id="analyticsText" style="font-size: 12px; color: #94a3b8; line-height: 1.6;"></div>
            </div>
        </div>

        <!-- SOZLAMALAR SAHIFASI -->
        <div id="pageSettings" class="section-page">
            <div class="glass-box">
                <div class="box-title">Tizim Sozlamalari</div>
                <button class="submit-btn" onclick="exportData()" style="background:#334155; margin-bottom:8px;">📥 Zaxira faylini yuklab olish</button>
                <button class="submit-btn" onclick="clearData()" style="background:#ef4444;">🗑 Barcha ma'lumotlarni o'chirish</button>
            </div>
        </div>
    </div>

    <script>
        var mode = 'exp';
        var transactions = [];
        var debts = [];
        var reminders = [];
        var limit = 0;

        function safeSave() {
            try {
                localStorage.setItem('capixy_db_v2', JSON.stringify({ t: transactions, d: debts, r: reminders, l: limit }));
            } catch(e) {}
            renderAll();
        }

        function safeLoad() {
            try {
                var data = localStorage.getItem('capixy_db_v2');
                if(data) {
                    var p = JSON.parse(data);
                    transactions = p.t || [];
                    debts = p.d || [];
                    reminders = p.r || [];
                    limit = p.l || 0;
                    document.getElementById('budgetLimit').value = limit || '';
                }
            } catch(e) {}
            renderAll();
        }

        function showTab(pageId, btnId) {
            var pages = document.querySelectorAll('.section-page');
            for(var i=0; i<pages.length; i++) pages[i].classList.remove('active');
            
            var tabs = document.querySelectorAll('.tab-btn');
            for(var j=0; j<tabs.length; j++) tabs[j].classList.remove('active');

            document.getElementById(pageId).classList.add('active');
            document.getElementById(btnId).classList.add('active');

            if(pageId === 'pageAnalytics') renderAnalytics();
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btnExp').className = 'sw-btn ' + (m === 'exp' ? 'active exp' : '');
            document.getElementById('btnInc').className = 'sw-btn ' + (m === 'inc' ? 'active inc' : '');
        }

        function addTransaction() {
            var name = document.getElementById('tName').value;
            var amount = parseFloat(document.getElementById('tAmount').value);

            if(!name || !amount || amount <= 0) {
                alert("Ma'lumotlarni kiriting!");
                return;
            }

            transactions.unshift({ id: Date.now(), name: name, amount: amount, type: mode, date: new Date().toLocaleDateString() });
            document.getElementById('tName').value = '';
            document.getElementById('tAmount').value = '';
            safeSave();
        }

        function addDebt() {
            var name = document.getElementById('dName').value;
            var amount = parseFloat(document.getElementById('dAmount').value);
            var type = document.getElementById('dType').value;

            if(!name || !amount || amount <= 0) {
                alert("Qarz ma'lumotlarini kiriting!");
                return;
            }

            debts.unshift({ id: Date.now(), name: name, amount: amount, type: type });
            document.getElementById('dName').value = '';
            document.getElementById('dAmount').value = '';
            safeSave();
        }

        function addReminder() {
            var title = document.getElementById('rTitle').value;
            var timeVal = document.getElementById('rTime').value;

            if(!title || !timeVal) {
                alert("Eslatma ma'lumotlarini kiriting!");
                return;
            }

            reminders.push({ id: Date.now(), title: title, time: timeVal });
            document.getElementById('rTitle').value = '';
            document.getElementById('rTime').value = '';
            safeSave();
            alert("Eslatma saqlandi!");
        }

        function reqNotif() {
            if ("Notification" in window) {
                Notification.requestPermission().then(function(p) {
                    alert(p === "granted" ? "Ruxsat berildi" : "Ruxsat berilmadi");
                });
            } else {
                alert("Brauzeringiz bildirishnomani qo'llab-quvvatlamaydi");
            }
        }

        function saveLimit() {
            limit = parseFloat(document.getElementById('budgetLimit').value) || 0;
            safeSave();
            alert("Limit saqlandi");
        }

        function clearData() {
            if(confirm("Ma'lumotlarni o'chirmoqchimisiz?")) {
                localStorage.removeItem('capixy_db_v2');
                transactions = []; debts = []; reminders = []; limit = 0;
                safeSave();
            }
        }

        function exportData() {
            var str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ t: transactions, d: debts, r: reminders, l: limit }));
            var a = document.createElement('a');
            a.href = str;
            a.download = "capixy_backup.json";
            a.click();
        }

        function delTrans(id) {
            transactions = transactions.filter(function(t){ return t.id !== id; });
            safeSave();
        }

        function delDebt(id) {
            debts = debts.filter(function(d){ return d.id !== id; });
            safeSave();
        }

        function delReminder(id) {
            reminders = reminders.filter(function(r){ return r.id !== id; });
            safeSave();
        }

        function renderAll() {
            var inc = 0, exp = 0;
            for(var i=0; i<transactions.length; i++) {
                if(transactions[i].type === 'inc') inc += transactions[i].amount;
                else exp += transactions[i].amount;
            }
            var bal = inc - exp;

            document.getElementById('uiBalance').innerText = bal.toLocaleString() + " UZS";
            document.getElementById('uiIncome').innerText = "+" + inc.toLocaleString() + " UZS";
            document.getElementById('uiExpense').innerText = "-" + exp.toLocaleString() + " UZS";

            var tHtml = '';
            if(transactions.length === 0) tHtml = '<div style="text-align:center; font-size:11px; color:#64748b;">Ro\'yxat bo\'sh</div>';
            for(var j=0; j<transactions.length; j++) {
                var item = transactions[j];
                tHtml += '<div class="item-row"><div><div class="item-title">' + item.name + '</div><div class="item-sub">' + item.date + '</div></div><div class="item-right"><div class="item-val ' + item.type + '">' + (item.type==='inc'?'+':'-') + item.amount.toLocaleString() + ' UZS</div><button class="del-btn" onclick="delTrans(' + item.id + ')">✕</button></div></div>';
            }
            document.getElementById('transList').innerHTML = tHtml;

            var dHtml = '';
            if(debts.length === 0) dHtml = '<div style="text-align:center; font-size:11px; color:#64748b;">Qarzlar yo\'q</div>';
            for(var k=0; k<debts.length; k++) {
                var d = debts[k];
                dHtml += '<div class="item-row"><div><div class="item-title">' + d.name + '</div><div class="item-sub">' + (d.type==='give'?'Menga berishi kerak':'Men berishim kerak') + '</div></div><div class="item-right"><div class="item-val ' + (d.type==='give'?'inc':'exp') + '">' + d.amount.toLocaleString() + ' UZS</div><button class="del-btn" onclick="delDebt(' + d.id + ')">✕</button></div></div>';
            }
            document.getElementById('debtList').innerHTML = dHtml;

            var rHtml = '';
            if(reminders.length === 0) rHtml = '<div style="text-align:center; font-size:11px; color:#64748b;">Eslatmalar yo\'q</div>';
            for(var m=0; m<reminders.length; m++) {
                var r = reminders[m];
                rHtml += '<div class="item-row"><div><div class="item-title">' + r.title + '</div><div class="item-sub">' + r.time + '</div></div><div class="item-right"><button class="del-btn" onclick="delReminder(' + r.id + ')">✕</button></div></div>';
            }
            document.getElementById('reminderList').innerHTML = rHtml;
        }

        function renderAnalytics() {
            var exp = 0;
            for(var i=0; i<transactions.length; i++) {
                if(transactions[i].type === 'exp') exp += transactions[i].amount;
            }
            var txt = 'Jami xarajat: <b>' + exp.toLocaleString() + ' UZS</b><br>';
            if(limit > 0) {
                var pct = Math.round((exp / limit) * 100);
                txt += 'Belgilangan limit: <b>' + limit.toLocaleString() + ' UZS</b><br>Ishlatildi: <b>' + pct + '%</b>';
            } else {
                txt += 'Limit belgilanmagan.';
            }
            document.getElementById('analyticsText').innerHTML = txt;
        }

        // Dastlabki yuklanish
        safeLoad();
    </script>
</body>
</html>
